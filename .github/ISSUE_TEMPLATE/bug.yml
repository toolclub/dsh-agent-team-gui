name: Bug report
description: Report a reproducible dsh-agent-team-gui problem without including secrets.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the plugin. Remove API keys, credentials, private prompts,
        personal paths, and proprietary model output before submitting logs or exports.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or Git commit
      description: Use the installed tag or full commit SHA.
      placeholder: v1.0.1 or 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Output of `dsh --version`.
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows / WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List exact steps from a fresh page or profile.
      placeholder: |
        1. Create ...
        2. Select ...
        3. Reload ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant browser console/Host output and whether an isolated smoke passes. Do not paste credentials or a complete private run export.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal paths, private prompts, and proprietary output.
          required: true
        - label: I searched existing open and closed issues for the same problem.
          required: true
